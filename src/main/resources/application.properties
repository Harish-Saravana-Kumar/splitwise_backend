###############################
# Database (PostgreSQL / Neon)
###############################
# In production, set the full JDBC URL via SPRING_DATASOURCE_URL environment variable.
# Example (Neon pooler):
# SPRING_DATASOURCE_URL=jdbc:postgresql://ep-withered-moon-ao2tq2rh-pooler.c-2.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/splitwise_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Hikari connection pool tuning (override via env if needed)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

###############################
# JPA / Hibernate
###############################
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# For production, consider 'validate' or managing migrations with Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM2DDL:update}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_HIBERNATE_FORMAT_SQL:false}

###############################
# Server
###############################
server.port=${PORT:8080}

###############################
# Mail configuration (use env vars for secrets)
###############################
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:noreply@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${APP_MAIL_FROM:noreply@example.com}

###############################
# JWT (move secret to env in production)
###############################
jwt.secret=${JWT_SECRET:please-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

###############################
# Assistant / LLM config (move keys to env)
###############################
assistant.enabled=${ASSISTANT_ENABLED:true}
assistant.provider=${ASSISTANT_PROVIDER:groq}
assistant.model=${ASSISTANT_MODEL:llama-3.1-8b-instant}
assistant.api-key=${ASSISTANT_API_KEY:}
assistant.base-url=${ASSISTANT_BASE_URL:https://api.groq.com/openai/v1}
assistant.temperature=${ASSISTANT_TEMPERATURE:0.2}
assistant.max-output-tokens=${ASSISTANT_MAX_OUTPUT_TOKENS:300}
assistant.timeout-seconds=${ASSISTANT_TIMEOUT_SECONDS:30}
assistant.history-load-limit=${ASSISTANT_HISTORY_LOAD_LIMIT:4}

langchain4j.open-ai.chat-model.base-url=${LANGCHAIN4J_OPENAI_BASE_URL:https://api.groq.com/openai/v1}
langchain4j.open-ai.chat-model.api-key=${LANGCHAIN4J_OPENAI_API_KEY:}
langchain4j.open-ai.chat-model.model-name=${LANGCHAIN4J_OPENAI_MODEL_NAME:llama-3.1-8b-instant}
langchain4j.open-ai.chat-model.temperature=${LANGCHAIN4J_OPENAI_TEMPERATURE:0.2}
langchain4j.open-ai.chat-model.max-completion-tokens=${LANGCHAIN4J_OPENAI_MAX_COMPLETION_TOKENS:300}
langchain4j.open-ai.chat-model.timeout=${LANGCHAIN4J_OPENAI_TIMEOUT:30s}

###############################
# Firebase Admin service account location for Google auth (keep local path for dev)
###############################
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase/serviceAccountKey.json}

logging.level.org.springframework.mail=${LOGGING_MAIL_LEVEL:DEBUG}
logging.level.org.eclipse.angus.mail=${LOGGING_ANGUS_LEVEL:DEBUG}

